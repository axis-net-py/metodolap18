<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Método LAP 18 — Liderança em Alta Performance</title>
  <meta name="robots" content="noindex" />
  <style>html,body{margin:0;background:#081426;color:#fff;font-family:Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center}.restore-status{opacity:.78;letter-spacing:.08em;font-size:12px;text-transform:uppercase}</style>
</head>
<body>
  <div class="restore-status">Carregando Método LAP 18…</div>
  <script>
    (async()=>{
      try{
        const url='https://raw.githubusercontent.com/axis-net-py/metodolap18/d4d5618ec402d74aa23c9775fe4242e58e2049c2/index.html';
        const response=await fetch(url,{cache:'no-store'});
        if(!response.ok)throw new Error('Falha ao carregar landing');
        const html=await response.text();
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        document.body.innerHTML='<main style="max-width:680px;padding:40px;text-align:center"><h1>Método LAP 18</h1><p>A landing está sendo restaurada. Tente novamente em instantes.</p></main>';
      }
    })();
  </script>
</body>
</html>
