name: Activate updated CTA video

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-pitch-web.yml'

permissions:
  contents: write

jobs:
  switch-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point landing page to updated video
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'src="pitch.mp4"'
          new = 'src="pitch_web.mp4"'
          if new in s:
              print('Updated video already active')
          elif old in s:
              p.write_text(s.replace(old, new, 1))
              print('Landing page updated')
          else:
              raise SystemExit('Expected pitch.mp4 source not found')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: use updated CTA video'
          git push
