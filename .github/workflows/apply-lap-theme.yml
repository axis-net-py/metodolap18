name: Apply LAP theme

on:
  push:
    paths:
      - '.github/workflows/apply-lap-theme.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add theme stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          link = '  <link rel="stylesheet" href="lap-theme.css" />\n'
          if 'href="lap-theme.css"' not in s:
              marker = '  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />\n'
              if marker not in s:
                  raise SystemExit('stylesheet insertion marker not found')
              s = s.replace(marker, marker + link, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-lap-theme.yml
      - name: Commit landing theme activation
        run: |
          git config user.name "axis-net-py"
          git config user.email "allaneggert1@gmail.com"
          git add index.html .github/workflows/apply-lap-theme.yml
          git commit -m "style: activate certificate-blue LAP design system"
          git push
